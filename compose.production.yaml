services:
  db:
    image: mirror.ccs.tencentyun.com/library/postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: seed
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      CONTENT_ARTICLE_DIR: /app/content-data/articles
    ports:
      - "127.0.0.1:3999:3000"
    volumes:
      - media_data:/app/media
      - content_data:/app/content-data
    depends_on:
      seed:
        condition: service_completed_successfully
    networks:
      internal:

networks:
  internal:

volumes:
  postgres_data:
  media_data:
  content_data:
